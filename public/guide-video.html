<!doctype html><html lang="ru"><meta charset="utf-8"><style>html,body{margin:0;background:#0b1220;color:#fff;font:20px Arial}iframe{position:absolute;left:0;top:0;width:1280px;height:650px;border:0;background:#f6f8fb}.caption{position:absolute;left:0;bottom:0;width:1280px;height:70px;background:#111827ee;display:flex;align-items:center;padding:0 34px;box-sizing:border-box;gap:18px}.num{background:#2563eb;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-weight:800}.caption b{font-size:22px}.caption span{color:#aebbd0;font-size:16px}</style><iframe src="/?demo=1"></iframe><div class="caption" id="caption"></div><script>const steps=[['1','Рабочий стол','Запускаем аудит и сразу видим продажи, WB-расходы и точность расчёта.'],['2','Фильтры и сортировка','Отбираем бренд, статус и сортируем товары по прибыли или возвратам.'],['3','Полная экономика','Открываем строку товара и видим все компоненты прибыли, логистики и маржи.'],['4','Фото и название','По Content API загружаем название и фотографии только выбранной карточки.'],['5','Остатки и дефицит','По Analytics API смотрим запас в днях и сколько заказать на 30 дней.'],['6','Результат','Действуем по приоритетам, экспортируем отчёт и не сохраняем токены.']];const i=Number(new URLSearchParams(location.search).get('step')||0),s=steps[Math.max(0,Math.min(steps.length-1,i))];document.querySelector('#caption').innerHTML=`<div class="num">${s[0]}</div><b>${s[1]}</b><span>${s[2]}</span>`</script></html>
