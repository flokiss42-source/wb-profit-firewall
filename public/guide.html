<!doctype html><html lang="ru"><meta charset="utf-8"><style>body{margin:0;background:#f6f8fb;font:28px Arial;color:#172033}main{width:1280px;height:720px;padding:72px;box-sizing:border-box;background:#fff}h1{font-size:54px;margin:25px 0 18px}h2{font-size:38px;margin:0 0 24px;color:#2563eb}p{color:#697586;line-height:1.5}.brand{color:#2563eb;font-weight:800;letter-spacing:3px;font-size:18px}.step{display:flex;gap:20px;align-items:center;margin:24px 0}.n{display:grid;place-items:center;background:#2563eb;color:white;border-radius:50%;width:52px;height:52px;font-weight:800}.tip{margin-top:42px;background:#eef4ff;padding:20px;border-radius:12px;color:#315aab;font-size:22px}</style><main id="slide"></main><script>const slides=[['WB PROFIT FIREWALL','Прибыль под контролем','Практический гайд для продавца Wildberries','Локальный кабинет: токен используется только во время запроса.'],['ШАГ 1 · АУДИТ','Запустите финансовую проверку','<div class="step"><b class="n">1</b><span>Откройте 127.0.0.1:3847</span></div><div class="step"><b class="n">2</b><span>Вставьте read-only токен «Статистика»</span></div><div class="step"><b class="n">3</b><span>Выберите период и нажмите «Запустить аудит»</span></div>','Сначала используйте отдельный read-only токен. Никогда не вставляйте мастер-токен.'],['ШАГ 2 · СЕБЕСТОИМОСТЬ','Загрузите прайс Excel','<div class="step"><b class="n">1</b><span>Раскройте «Настроить расчёт»</span></div><div class="step"><b class="n">2</b><span>Загрузите .xls, .xlsx или .csv</span></div><div class="step"><b class="n">3</b><span>Проверьте строки баркод = себестоимость</span></div>','Поддерживаются старые .xls, заголовки на любом ряду и «штрих код».'],['ШАГ 3 · АНАЛИТИКА','Читайте результат правильно','<div class="step"><b class="n">1</b><span>Проверьте паспорт точности</span></div><div class="step"><b class="n">2</b><span>Используйте фильтр по бренду и статусу</span></div><div class="step"><b class="n">3</b><span>Нажмите на товар для полной экономики</span></div>','Если себестоимость не задана, прибыль не подменяется нулём — расчёт честно отмечается неполным.'],['ШАГ 4 · ОСТАТКИ И ФОТО','Подключите дополнительные данные','<div class="step"><b class="n">1</b><span>Analytics-токен → остатки и прогноз дефицита</span></div><div class="step"><b class="n">2</b><span>Content-токен → название и фото карточки</span></div><div class="step"><b class="n">3</b><span>Данные загружаются по запросу и не сохраняются</span></div>','Для каждой категории WB нужен отдельный токен с минимальными правами.'],['ГОТОВО','Что контролировать каждый день','<div class="step"><b class="n">✓</b><span>Убыточные баркоды и высокий ДРР</span></div><div class="step"><b class="n">✓</b><span>Товары, которые закончатся раньше закупки</span></div><div class="step"><b class="n">✓</b><span>Потери между поставкой, продажей и остатком</span></div>','Не меняйте цены и рекламу автоматически без предпросмотра и подтверждения.']];const i=Number(new URLSearchParams(location.search).get('slide')||0),s=slides[Math.max(0,Math.min(slides.length-1,i))];document.querySelector('#slide').innerHTML=`<div class="brand">${s[0]}</div><h1>${s[1]}</h1>${s[2]?`<div>${s[2]}</div>`:''}<div class="tip">${s[3]}</div>`</script></html>
